<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Become a Supplier - AfriTrade Global</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="export-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🌍 AfriTrade Global</h1>
                    <span>Supplier Registration</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container" style="padding: 2rem;">
        <h1>Join Our Export Network</h1>
        <div class="action-card">
            <h3>Supplier Application</h3>
            <form id="supplierForm">
                <input type="text" placeholder="Company Name" required>
                <input type="email" placeholder="Email" required>
                <select>
                    <option>Select Product Category</option>
                    <option>Wine & Spirits</option>
                    <option>Fruits & Agriculture</option>
                    <option>Crafts & Minerals</option>
                    <option>Textiles & Fashion</option>
                    <option>Spices & Foods</option>
                </select>
                <textarea placeholder="Describe your products..." rows="4"></textarea>
                <button type="submit" class="btn-primary">Apply Now</button>
            </form>
        </div>
    </div>
</body>
</html>
