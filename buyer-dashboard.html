<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Dashboard - AfriTrade Global</title>
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        .buyer-dashboard {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .buyer-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .order-section {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            margin-bottom: 2rem;
        }
        .cart-items {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 1rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            gap: 1.5rem;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #f8fafc;
            padding: 0.5rem;
            border-radius: var(--radius-md);
        }
        .quantity-btn {
            background: white;
            border: 2px solid #e2e8f0;
            width: 2rem;
            height: 2rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }
        .quantity-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .quantity-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .quantity-display {
            font-weight: 600;
            min-width: 4rem;
            text-align: center;
        }
        .cart-summary {
            background: var(--gradient-primary);
            color: white;
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            margin-top: 1.5rem;
        }
        .quick-order-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }
        @media (max-width: 768px) {
            .quick-order-grid {
                grid-template-columns: 1fr;
            }
            .cart-item {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="export-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🌍 AfriTrade Global</h1>
                    <span>Buyer Dashboard</span>
                </div>
                <nav class="main-nav">
                    <!-- Navigation will be loaded by unified-navigation.js -->
                </nav>
                <div class="header-actions">
                    <span id="cartCount" style="background: var(--primary); color: white; padding: 0.25rem 0.5rem; border-radius: 50%; width: 1.5rem; height: 1.5rem; display: none; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600;">0</span>
                    <a href="export-products.html" class="btn-secondary">Continue Shopping</a>
                </div>
            </div>
        </div>
    </header>

    <div class="buyer-dashboard">
        <!-- Buyer Stats -->
        <div class="buyer-stats">
            <div class="stat-card">
                <h3 id="cartItemsCount">0 items</h3>
                <p>In Your Cart</p>
            </div>
            <div class="stat-card">
                <h3 id="totalOrders">0</h3>
                <p>Total Orders</p>
            </div>
            <div class="stat-card">
                <h3 id="pendingOrders">0</h3>
                <p>Pending Orders</p>
            </div>
            <div class="stat-card">
                <h3 id="totalSpent">R0</h3>
                <p>Total Spent</p>
            </div>
        </div>

        <!-- Shopping Cart -->
        <div class="order-section">
            <div style="display: flex; justify-content: between; align-items: center; margin-bottom: 1.5rem;">
                <h3>🛒 Your Shopping Cart</h3>
                <button onclick="enhancedCart.clearCart()" class="btn-danger" style="padding: 0.5rem 1rem;">Clear Cart</button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be loaded here -->
            </div>
            
            <div class="cart-summary">
                <div style="display: flex; justify-content: between; align-items: center;">
                    <div>
                        <h4 style="margin: 0; color: white;">Order Total</h4>
                        <p style="margin: 0; opacity: 0.9;" id="cartItemsCountSummary">0 items</p>
                    </div>
                    <div style="text-align: right;">
                        <h2 style="margin: 0; color: white;" id="cartTotal">R0.00</h2>
                        <button onclick="enhancedCart.proceedToCheckout()" 
                                class="btn-primary" 
                                style="background: white; color: var(--primary); margin-top: 0.5rem;">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Order -->
        <div class="order-section">
            <h3>⚡ Quick Order</h3>
            <p style="color: #64748b; margin-bottom: 1.5rem;">Quickly add products to your cart</p>
            
            <div class="quick-order-grid">
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Select Product</label>
                    <select id="quickProductSelect" style="width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: var(--radius-md);">
                        <option value="">Choose a product...</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Quantity</label>
                    <input type="number" id="quickQuantity" value="1" min="1" style="width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: var(--radius-md);">
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Unit Price</label>
                    <div id="quickPrice" style="padding: 0.75rem; background: #f8fafc; border-radius: var(--radius-md); text-align: center; font-weight: 600;">R0.00</div>
                </div>
                <div>
                    <button onclick="enhancedCart.quickAddToCart()" class="btn-primary" style="height: fit-content;">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Order History -->
        <div class="order-section">
            <h3>📋 Order History</h3>
            <div id="orderHistory">
                <!-- Orders will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/unified-navigation.js"></script>
    <script src="js/buyer-cart-enhanced.js"></script>
</body>
</html>
