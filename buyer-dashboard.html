<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Cart - AfriTrade Global</title>
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        .cart-hero {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }
        
        .cart-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        .cart-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .cart-items {
            margin-bottom: 2rem;
        }
        
        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            align-items: center;
        }
        
        .cart-item:last-child {
            border-bottom: none;
        }
        
        .cart-item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .cart-item-details {
            flex: 1;
        }
        
        .cart-item-name {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .cart-item-supplier {
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .cart-item-price {
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .quantity-btn {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .quantity-input {
            width: 50px;
            text-align: center;
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 5px;
        }
        
        .cart-summary {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 10px;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        
        .summary-total {
            font-size: 1.2rem;
            font-weight: 700;
            border-top: 2px solid #e2e8f0;
            padding-top: 1rem;
            margin-top: 1rem;
        }
        
        .empty-cart {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }
        
        .empty-cart-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                text-align: center;
            }
            
            .cart-item-details {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header style="background: #1e3c72; color: white; padding: 1rem 0; position: sticky; top: 0; z-index: 1000;">
        <div class="cart-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 style="margin: 0; font-size: 1.2rem;">🌍 AfriTrade Global</h1>
                    <p style="margin: 0; font-size: 0.7rem; opacity: 0.8;">Export Cart</p>
                </div>
                <nav style="display: flex; gap: 15px; align-items: center;">
                    <a href="export-index.html" style="color: white; text-decoration: none; font-size: 0.9rem;">Home</a>
                    <a href="export-products.html" style="color: white; text-decoration: none; font-size: 0.9rem;">Products</a>
                    <a href="buyer-dashboard.html" style="color: #ffd700; text-decoration: none; font-size: 0.9rem; font-weight: 600;">Cart 
                        <span id="headerCartCount" style="background: #ffd700; color: #1e3c72; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; margin-left: 5px;">0</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <section class="cart-hero">
            <div class="cart-container">
                <h1 style="margin: 0 0 1rem 0; font-size: 1.8rem;">Export Cart</h1>
                <p style="opacity: 0.9; margin: 0;">Review your selected export products</p>
            </div>
        </section>

        <div class="cart-container">
            <div class="cart-section">
                <h2 style="margin-bottom: 2rem;">Your Export Selection</h2>
                
                <div id="cartItems" class="cart-items">
                    <!-- Cart items will be loaded here -->
                </div>
                
                <div id="cartSummary" class="cart-summary">
                    <!-- Cart summary will be loaded here -->
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap;">
                    <button class="btn-primary large" onclick="proceedToInquiry()" id="proceedBtn" disabled>
                        📧 Proceed to Export Inquiry
                    </button>
                    <button class="btn-outline large" onclick="continueShopping()">
                        🛒 Continue Shopping
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem('export_cart')) || [];
        }

        function saveCart(cart) {
            localStorage.setItem('export_cart', JSON.stringify(cart));
            loadCart();
            updateCartUI();
        }

        function updateCartUI() {
            const cart = getCart();
            const cartCount = document.getElementById('headerCartCount');
            if (cartCount) {
                cartCount.textContent = cart.length;
            }
        }

        function loadCart() {
            const cart = getCart();
            const cartItems = document.getElementById('cartItems');
            const cartSummary = document.getElementById('cartSummary');
            const proceedBtn = document.getElementById('proceedBtn');

            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <h3>Your export cart is empty</h3>
                        <p>Add products from the export marketplace to get started</p>
                        <button class="btn-primary" onclick="continueShopping()" style="margin-top: 1rem;">
                            Browse Export Products
                        </button>
                    </div>
                `;
                cartSummary.innerHTML = '';
                proceedBtn.disabled = true;
                return;
            }

            // Enable proceed button
            proceedBtn.disabled = false;

            // Load cart items
            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}" class="cart-item-image"
                         onerror="this.src='https://via.placeholder.com/80x80/1e3c72/FFFFFF?text=Product'">
                    <div class="cart-item-details">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-supplier">Supplier: ${item.supplier}</div>
                        <div class="cart-item-price">$${item.price}/${item.unit} (Min: ${item.minOrder})</div>
                    </div>
                    <div class="cart-item-quantity">
                        <button class="quantity-btn" onclick="updateQuantity('${item.id}', ${item.quantity - 1})">-</button>
                        <input type="number" class="quantity-input" value="${item.quantity}" 
                               min="1" onchange="updateQuantity('${item.id}', parseInt(this.value))">
                        <button class="quantity-btn" onclick="updateQuantity('${item.id}', ${item.quantity + 1})">+</button>
                    </div>
                    <button class="btn-outline" onclick="removeFromCart('${item.id}')" style="padding: 8px 12px;">
                        🗑️ Remove
                    </button>
                </div>
            `).join('');

            // Load cart summary
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalValue = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            cartSummary.innerHTML = `
                <div class="summary-item">
                    <span>Total Items:</span>
                    <span>${totalItems}</span>
                </div>
                <div class="summary-item">
                    <span>Products:</span>
                    <span>${cart.length}</span>
                </div>
                <div class="summary-item summary-total">
                    <span>Total Export Value:</span>
                    <span>$${totalValue.toFixed(2)}</span>
                </div>
            `;
        }

        function updateQuantity(productId, newQuantity) {
            if (newQuantity < 1) return;
            
            const cart = getCart();
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity = newQuantity;
                saveCart(cart);
            }
        }

        function removeFromCart(productId) {
            const cart = getCart().filter(item => item.id !== productId);
            saveCart(cart);
        }

        function proceedToInquiry() {
            const cart = getCart();
            if (cart.length === 0) return;

            // Create inquiry summary
            const inquirySummary = cart.map(item => 
                `${item.name} (${item.quantity} ${item.unit}s) - $${item.price * item.quantity}`
            ).join('\n');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            alert(`Export Inquiry Ready!\n\nProducts:\n${inquirySummary}\n\nTotal: $${total.toFixed(2)}\n\nThis would open an export inquiry form.`);
        }

        function continueShopping() {
            window.location.href = 'export-products.html';
        }

        // Initialize cart
        document.addEventListener('DOMContentLoaded', function() {
            loadCart();
            updateCartUI();
        });
    </script>
</body>
</html>
