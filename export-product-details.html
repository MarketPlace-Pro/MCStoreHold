<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Product Details - AfriTrade Global</title>
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        .product-detail-hero {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 3rem 0;
        }
        
        .product-detail-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin: 3rem 0;
        }
        
        .product-image-large {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .product-info-detail {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .product-category-badge {
            display: inline-block;
            background: var(--gradient-primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .product-title-detail {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }
        
        .product-supplier-detail {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .product-origin-detail {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }
        
        .product-description-detail {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        
        .export-specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .spec-card {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
        }
        
        .spec-card h4 {
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        
        .spec-card p {
            color: var(--text-light);
            margin: 0;
            font-size: 1rem;
        }
        
        .pricing-card {
            background: var(--gradient-primary);
            color: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            margin: 2rem 0;
        }
        
        .price-main {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .price-unit {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .moq-info {
            font-size: 1.1rem;
            margin: 1rem 0;
        }
        
        .certification-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        
        .cert-badge {
            background: var(--success);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .btn-contact-export {
            flex: 2;
            background: var(--success);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-inquiry {
            flex: 1;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container fade-in-up">
            <div class="header-content">
                <div class="logo">
                    <h1><a href="export-index.html">🌍 AfriTrade Global</a></h1>
                    <p>Africa to World Export Platform</p>
                </div>
                <nav class="main-nav">
                    <a href="export-index.html" class="nav-link">Home</a>
                    <a href="export-products.html" class="nav-link">Export Products</a>
                    <a href="supplier-portal.html" class="nav-link">For Exporters</a>
                    <a href="buyer-dashboard.html" class="nav-link">For Importers</a>
                </nav>
                <div class="header-actions">
                    <a href="admin-access.html" class="btn-outline">Export Tools</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="product-detail-hero">
            <div class="product-detail-container">
                <a href="export-products.html" class="btn-outline" style="background: rgba(255,255,255,0.2); color: white; border-color: white;">← Back to Products</a>
            </div>
        </section>

        <div class="product-detail-container">
            <div class="product-detail-grid">
                <div>
                    <img id="productImage" src="" alt="" class="product-image-large">
                </div>
                
                <div class="product-info-detail">
                    <div id="productCategory" class="product-category-badge"></div>
                    <h1 id="productTitle" class="product-title-detail"></h1>
                    <div id="productSupplier" class="product-supplier-detail"></div>
                    <div id="productOrigin" class="product-origin-detail"></div>
                    <p id="productDescription" class="product-description-detail"></p>
                    
                    <div class="pricing-card">
                        <div class="price-main" id="productPrice"></div>
                        <div class="price-unit" id="productUnit"></div>
                        <div class="moq-info" id="productMOQ"></div>
                    </div>
                    
                    <div class="certification-badges" id="certificationBadges"></div>
                    
                    <div class="export-specs-grid">
                        <div class="spec-card">
                            <h4>🌍 Export Markets</h4>
                            <p id="exportMarkets"></p>
                        </div>
                        <div class="spec-card">
                            <h4>🚢 Shipping Method</h4>
                            <p id="shippingMethod"></p>
                        </div>
                        <div class="spec-card">
                            <h4>⏱️ Lead Time</h4>
                            <p id="leadTime"></p>
                        </div>
                        <div class="spec-card">
                            <h4>📦 Packaging</h4>
                            <p id="packagingInfo"></p>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn-contact-export" onclick="contactExporter()">
                            📞 Contact Exporter Directly
                        </button>
                        <button class="btn-inquiry" onclick="sendInquiry()">
                            📧 Send Detailed Inquiry
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Additional product details will be loaded here -->
            <div id="additionalDetails"></div>
        </div>
    </main>

    <script src="js/export-enhanced-data.js"></script>
    <script>
        // Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        function loadProductDetails() {
            if (!productId) {
                document.body.innerHTML = '<div class="container"><h1>Product Not Found</h1><p>No product ID specified.</p></div>';
                return;
            }
            
            const product = exportProducts.find(p => p.id === productId);
            
            if (!product) {
                document.body.innerHTML = '<div class="container"><h1>Product Not Found</h1><p>The requested product could not be found.</p></div>';
                return;
            }
            
            // Populate basic product information
            document.getElementById('productImage').src = product.image;
            document.getElementById('productImage').alt = product.name;
            document.getElementById('productCategory').textContent = getCategoryName(product.category);
            document.getElementById('productTitle').textContent = product.name;
            document.getElementById('productSupplier').textContent = `Supplier: ${product.supplier}`;
            document.getElementById('productOrigin').textContent = `Origin: ${product.origin}`;
            document.getElementById('productDescription').textContent = product.description;
            document.getElementById('productPrice').textContent = `$${product.price}`;
            document.getElementById('productUnit').textContent = `per ${product.unit}`;
            document.getElementById('productMOQ').textContent = `Minimum Order: ${product.minOrder} ${product.moqUnit || product.unit + 's'}`;
            document.getElementById('exportMarkets').textContent = product.exportMarkets?.join(', ') || 'Global Markets';
            document.getElementById('shippingMethod').textContent = product.shipping || 'Standard Container';
            document.getElementById('leadTime').textContent = product.leadTime || '15-30 days';
            document.getElementById('packagingInfo').textContent = product.packaging || 'Standard export packaging';
            
            // Populate certification badges
            const certContainer = document.getElementById('certificationBadges');
            if (product.certification && product.certification.length > 0) {
                certContainer.innerHTML = product.certification.map(cert => 
                    `<span class="cert-badge">${cert}</span>`
                ).join('');
            }
            
            // Update page title
            document.title = `${product.name} - AfriTrade Global Export`;
            
            // Load additional details based on category
            loadAdditionalDetails(product);
        }
        
        function getCategoryName(category) {
            const categoryMap = {
                'wine': '🍷 Wine & Spirits',
                'fruits': '🍓 Fresh Fruits',
                'crafts': '🎨 Handicrafts & Art',
                'textiles': '👕 Textiles & Fashion',
                'spices': '🌶️ Spices & Foods'
            };
            return categoryMap[category] || category;
        }
        
        function loadAdditionalDetails(product) {
            const container = document.getElementById('additionalDetails');
            let additionalHTML = '<div class="export-specs-grid" style="margin-top: 3rem;">';
            
            // Category-specific details
            if (product.category === 'wine') {
                additionalHTML += `
                    <div class="spec-card">
                        <h4>🍷 Alcohol Content</h4>
                        <p>${product.alcoholContent || 'Not specified'}</p>
                    </div>
                    <div class="spec-card">
                        <h4>📅 Shelf Life</h4>
                        <p>${product.shelfLife || 'Not specified'}</p>
                    </div>
                `;
            } else if (product.category === 'fruits') {
                additionalHTML += `
                    <div class="spec-card">
                        <h4>🎯 Variety</h4>
                        <p>${product.variety || 'Not specified'}</p>
                    </div>
                    <div class="spec-card">
                        <h4>📅 Shelf Life</h4>
                        <p>${product.shelfLife || 'Not specified'}</p>
                    </div>
                `;
            } else if (product.category === 'crafts') {
                additionalHTML += `
                    <div class="spec-card">
                        <h4>🛠️ Materials</h4>
                        <p>${product.materials || 'Not specified'}</p>
                    </div>
                `;
            } else if (product.category === 'textiles') {
                additionalHTML += `
                    <div class="spec-card">
                        <h4>📏 Width</h4>
                        <p>${product.width || 'Not specified'}</p>
                    </div>
                    <div class="spec-card">
                        <h4>🧵 Material</h4>
                        <p>${product.material || 'Not specified'}</p>
                    </div>
                `;
            } else if (product.category === 'spices') {
                additionalHTML += `
                    <div class="spec-card">
                        <h4>📦 Form</h4>
                        <p>${product.form || 'Not specified'}</p>
                    </div>
                    <div class="spec-card">
                        <h4>📅 Shelf Life</h4>
                        <p>${product.shelfLife || 'Not specified'}</p>
                    </div>
                `;
            }
            
            additionalHTML += '</div>';
            container.innerHTML = additionalHTML;
        }
        
        function contactExporter() {
            const product = exportProducts.find(p => p.id === productId);
            if (product) {
                alert(`Contacting Exporter:\n\nProduct: ${product.name}\nSupplier: ${product.supplier}\n\nThis would open direct communication channels with the exporter.`);
            }
        }
        
        function sendInquiry() {
            const product = exportProducts.find(p => p.id === productId);
            if (product) {
                alert(`Sending Detailed Inquiry:\n\nProduct: ${product.name}\n\nA detailed inquiry form would open for specific quantity, shipping, and certification requirements.`);
            }
        }
        
        // Load product details when page loads
        document.addEventListener('DOMContentLoaded', loadProductDetails);
    </script>
</body>
</html>
