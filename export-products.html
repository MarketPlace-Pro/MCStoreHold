<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Products - AfriTrade Global</title>
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-info {
            padding: 1.5rem;
        }
        .product-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a202c;
        }
        .product-description {
            color: #718096;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 1rem;
        }
        .product-category {
            display: inline-block;
            background: #edf2f7;
            color: #4a5568;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container fade-in-up">
            <div class="header-content">
                <div class="logo">
                    <h1><a href="export-index.html">🌍 AfriTrade Global</a></h1>
                    <p>Africa to World Export Platform</p>
                </div>
                <nav class="main-nav">
                    <a href="export-index.html" class="nav-link">Home</a>
                    <a href="export-products.html" class="nav-link active">Products</a>
                    <a href="supplier-portal.html" class="nav-link">Suppliers</a>
                    <a href="buyer-dashboard.html" class="nav-link">Buyers</a>
                </nav>
                <div class="header-actions">
                    <a href="cart.html" class="btn-outline">View Cart</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero-section fade-in-up">
            <h1>All Export Products</h1>
            <p>Discover premium African products ready for global markets</p>
        </section>

        <div id="productsContainer" class="products-grid">
            <!-- Products will be loaded here -->
            <div>Loading products...</div>
        </div>
    </main>

    <script>
        // Simple products loader
        async function loadProducts() {
            try {
                const response = await fetch('products.json');
                const data = await response.json();
                displayProducts(data.products);
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsContainer').innerHTML = 
                    '<div class="error-message">Failed to load products. Please try again later.</div>';
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="error-message">No products available.</div>';
                return;
            }

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-image" 
                         onerror="this.src='https://via.placeholder.com/300x200/4A90E2/FFFFFF?text=Product+Image'">
                    <div class="product-info">
                        <div class="product-category">${product.category}</div>
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-description">${product.description}</p>
                        <div class="product-price">$${product.price}</div>
                        <button class="btn-primary" onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            alert('Added to cart: Product ' + productId);
            // Add actual cart logic here
        }

        // Load products when page loads
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
