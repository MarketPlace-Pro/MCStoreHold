<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Products - AfriTrade Global Export Platform</title>
    <link rel="stylesheet" href="modern-styles.css">
</head>
<body>
    <header>
        <div class="container fade-in-up">
            <div class="header-content">
                <div class="logo">
                    <h1><a href="export-index.html">🌍 AfriTrade Global</a></h1>
                    <p>Africa to World Export Platform</p>
                </div>
                <nav class="main-nav">
                    <a href="export-index.html" class="nav-link">Home</a>
                    <a href="export-products.html" class="nav-link active">Export Products</a>
                    <a href="supplier-portal.html" class="nav-link">For Exporters</a>
                    <a href="buyer-dashboard.html" class="nav-link">For Importers</a>
                </nav>
                <div class="header-actions">
                    <a href="admin-access.html" class="btn-outline">Export Tools</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Export Hero Section -->
        <section class="export-hero">
            <div class="container">
                <h1>African Export Products</h1>
                <p>Discover premium African products ready for international markets. Direct from exporters to global buyers.</p>
                
                <div class="export-search">
                    <input type="text" id="exportSearch" placeholder="🔍 Search export products, suppliers, origins...">
                </div>
            </div>
        </section>

        <div class="container">
            <!-- Export Categories -->
            <section id="categoriesSection">
                <h2 class="section-title">Export Categories</h2>
                <!-- Categories will be loaded here by JavaScript -->
            </section>

            <!-- Export Products Grid -->
            <section id="productsSection">
                <h2 class="section-title" id="productsTitle">All Export Products</h2>
                <div class="products-export-grid" id="productsContainer">
                    <!-- Products will be loaded here by JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <!-- Load the original export products data -->
    <script src="js/export-enhanced-data.js"></script>
    <!-- Load our new export-only system -->
    <script src="js/export-only-system.js"></script>
</body>
</html>
